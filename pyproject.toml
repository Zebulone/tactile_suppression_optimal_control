[project]
name = "suppression-oc"
version = "0.1.0"
description = "Tactile Suppression and Optimal Control"
readme = "README.md"
authors = [
    { name = "Fabian Tatai", email = "fabian.tatai@posteo.de" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "ipywidgets>=8.1.7,<9",
    "jax>=0.6.2,<0.7",
    "jinja2>=3.1.6,<4",
    "matplotlib>=3.10.3,<4",
    "numpy>=2.3.1,<3",
    "pandas>=2.3.0,<2.4",
    "pingouin>=0.5.5,<0.6",
    "scipy>=1.16.0,<2",
    "seaborn>=0.13.2,<0.14",
    "ipykernel>=6.29.5,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "nbconvert>=7.17.1",
]
